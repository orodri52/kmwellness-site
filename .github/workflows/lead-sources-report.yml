name: Weekly lead sources report

on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC (~7-8am Mountain Time)
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/lead-sources-report.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_TO_EMAILS: ${{ secrets.REPORT_TO_EMAILS }}
